# ===========================================================================
# Netlify Configuration — Valluvam Nonprofit Organization
# ===========================================================================
# Monorepo layout:
#   client/   → React + Vite frontend (static site)
#   server/   → Express.js backend API (Netlify Function)
# ===========================================================================

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
# No "base" is set — all paths are relative to the repository root.
# The build command installs server dependencies (for the Netlify Function)
# then installs client dependencies and produces the static frontend build.
# ---------------------------------------------------------------------------
[build]
  command = "cd server && npm install --production && cd ../client && npm install && npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

# ---------------------------------------------------------------------------
# API rewrite — proxy /api/* requests to the "api" Netlify Function
# ---------------------------------------------------------------------------
# Netlify passes the original request path in event.path, so Express
# receives /api/health, /api/events, etc. exactly as mounted in app.js.
# "force = true" ensures this rule wins even when _redirects exists.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# SPA fallback — serve index.html for all other routes (React Router)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Functions configuration
# ---------------------------------------------------------------------------
[functions]
  # Include the entire server directory in the function bundle so that
  # require('../../src/app') and all transitive dependencies resolve.
  included_files = ["server/**"]
